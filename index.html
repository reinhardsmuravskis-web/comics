<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Longbox</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d3dae4;--accent:#2b4eff;--onaccent:#fff;--hit:#ffd23f;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#eef1f7;--mute:#9aa8c2;--line:#2c3a58;--accent:#7f95ff;--onaccent:#0f1624;--hit:#ffd23f;--bad:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:900 2rem/1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:-.02em;margin:8px 0 2px;display:inline;background:linear-gradient(transparent 62%,var(--hit) 62%)}
h2{font-size:1.05rem;margin:28px 0 8px}
p.sub{color:var(--mute);margin:6px 0 16px}
section,details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
summary{cursor:pointer;font-weight:600}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
input:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--accent);color:var(--onaccent);cursor:pointer}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
#reader{margin-top:10px;border-radius:8px;overflow:hidden;position:relative}#reader video{width:100%;display:block}#reader canvas.drawingBuffer{position:absolute;left:0;top:0;width:100%;height:100%}
.msg{margin:10px 0 0;min-height:1.2em;color:var(--mute)}.msg.err{color:var(--bad)}
.hit{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hit:first-child{border-top:0}
.hit img,.ph{width:56px;height:84px;object-fit:cover;border-radius:4px;background:var(--line);flex:none}
.hit b{display:block}.hit small{color:var(--mute)}
.hit .grow{flex:1;min-width:0}
ul{list-style:none;padding:0;margin:0}
li.c{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}li.c:first-child{border-top:0}
li.c .grow{flex:1;min-width:0}li.c b{display:block}
.thumb{width:40px;height:60px;object-fit:cover;border-radius:3px;background:var(--line);flex:none}
</style>
</head>
<body>
<main>
<h1>Longbox</h1>
<p class="sub">Scan a comic, check the match, save it to your sheet.</p>

<details id="settings">
<summary>Connection</summary>
<label for="url">Apps Script web app URL</label><input id="url" inputmode="url" autocomplete="off">
<label for="token">Token</label><input id="token" type="password" autocomplete="off">
<p class="msg">Stored only in this browser.</p>
<button id="saveSet">Save connection</button>
</details>

<section>
<label for="code">Barcode, or title and author</label>
<div class="row"><input id="code" placeholder="Scan, or type e.g. Batman 89 by Sam Hamm"><button id="go" style="flex:0 0 auto">Search</button></div>
<div class="row" style="margin-top:8px"><button class="alt" id="cam">Scan with camera</button><button class="alt" id="manual">Enter by hand</button></div>
<div class="row" style="margin-top:8px"><button class="alt" id="photoBtn">Scan from a photo</button></div>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<div id="reader"></div>
<div id="msg" class="msg" role="status"></div>
<div id="issueFilterBox" hidden><label for="issueFilter">Issue number (the add-on code is not read, so narrow it here)</label><input id="issueFilter" inputmode="numeric"></div>
<div id="hits"></div>
</section>

<section id="manualBox" hidden>
<b id="formTitle">Add by hand</b>
<label for="mSeries">Series or title</label><input id="mSeries">
<div class="row"><div><label for="mIssue">Issue</label><input id="mIssue"></div><div><label for="mPub">Publisher</label><input id="mPub"></div></div>
<label for="mVar">Variant or printing</label><input id="mVar">
<div class="row"><div><label for="mDate">Cover date</label><input id="mDate"></div><div><label for="mBarcode">Barcode</label><input id="mBarcode" inputmode="numeric"></div></div>
<div class="row"><div><label for="mCond">Condition</label><input id="mCond"></div><div><label for="mPrice">Purchase price</label><input id="mPrice"></div></div>
<label for="mNotes">Notes</label><input id="mNotes">
<div class="row" style="margin-top:14px"><button id="mSave">Save</button><button class="alt" id="mCancel">Cancel</button><button class="danger" id="mDelete" hidden>Delete</button></div>
</section>

<h2>Your collection <span id="count" style="color:var(--mute);font-weight:400"></span></h2>
<input id="filter" placeholder="Filter by series or publisher">
<ul id="list" style="margin-top:8px"></ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k) || '' } catch (e) { return '' } },
                set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} } };
let results = [], owned = [], collection = [], pendingCode = '';

$('url').value = store.get('url'); $('token').value = store.get('token');
if (!store.get('url')) $('settings').open = true;
$('saveSet').onclick = () => { store.set('url', $('url').value.trim()); store.set('token', $('token').value.trim()); say('Connection saved.'); loadList(); };

function say(t, err) { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }

async function api(action, params = {}) {
  const u = new URL(store.get('url'));
  u.search = new URLSearchParams({ action, token: store.get('token'), ...params });
  const r = await fetch(u);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function showResults(j, label) {
  results = j.results || []; owned = j.owned || []; $('issueFilter').value = '';
  const n = results.length + owned.length;
  const own = owned.length ? ' You already own ' + owned.length + ' of this barcode.' : '';
  const keep = pendingCode ? ' The barcode ' + pendingCode + ' will be saved with the one you pick.' : '';
  say(n + ' possible match' + (n > 1 ? 'es' : '') + '.' + own + keep);
  $('issueFilterBox').hidden = n < 2;
  renderHits();
}

async function lookup(code) {
  if (!store.get('url')) { $('settings').open = true; return say('Add your connection first.', true); }
  say('Looking up ' + code + '...'); $('hits').textContent = ''; $('issueFilterBox').hidden = true; pendingCode = '';
  try {
    const j = await api('lookup', { code });
    if (!(j.results || []).length && !(j.owned || []).length) {
      pendingCode = j.code; results = []; owned = [];
      say('No match for ' + j.code + '. Search by title above, or enter it by hand. The barcode will be saved.', true);
      openManual(j.code); return;
    }
    showResults(j);
  } catch (e) { say(e.message, true); }
}

function renderHits() {
  const f = $('issueFilter').value.trim();
  const box = $('hits'); box.textContent = '';
  const items = owned.map(r => ({ r, own: true })).concat(results.map(r => ({ r, own: false })));
  items.filter(x => !f || String(x.r.issue) === f).forEach(({ r, own }) => {
    const d = document.createElement('div'); d.className = 'hit';
    let img;
    if (r.cover_url) { img = document.createElement('img'); img.src = r.cover_url; img.alt = ''; img.loading = 'lazy'; }
    else { img = document.createElement('div'); img.className = 'ph'; }
    const g = document.createElement('div'); g.className = 'grow';
    const b = document.createElement('b');
    b.textContent = r.title || (r.series + (r.issue ? ' #' + r.issue : '') + (r.variant ? ' (' + r.variant + ')' : ''));
    const s = document.createElement('small');
    s.textContent = (own ? 'In your collection. ' : '') + [r.publisher, r.cover_date].filter(Boolean).join(', ');
    const btn = document.createElement('button'); btn.textContent = own ? 'Add another copy' : 'Add to collection'; btn.style.marginTop = '6px';
    btn.onclick = () => save(r, own);
    g.append(b, s, document.createElement('br'), btn);
    d.append(img, g); box.append(d);
  });
}
$('issueFilter').oninput = renderHits;

async function save(row, force) {
  if (!row.barcode && pendingCode) row.barcode = pendingCode;
  try {
    const j = await api('add', { row: JSON.stringify(row), force: force ? '1' : '' });
    if (j.duplicate) {
      if (confirm('You already have this one. Add another copy?')) return save(row, true);
      return;
    }
    say('Saved.'); $('hits').textContent = ''; $('code').value = ''; $('issueFilterBox').hidden = true; pendingCode = '';
    loadList();
  } catch (e) { say(e.message, true); }
}

let editing = null;
const FIELDS = { series: 'mSeries', issue: 'mIssue', publisher: 'mPub', variant: 'mVar', cover_date: 'mDate',
  barcode: 'mBarcode', condition: 'mCond', purchase_price: 'mPrice', notes: 'mNotes' };
function openForm(title, data) {
  $('formTitle').textContent = title;
  Object.keys(FIELDS).forEach(k => $(FIELDS[k]).value = (data && data[k]) || '');
  $('mDelete').hidden = !editing;
  $('manualBox').hidden = false;
  $('manualBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function openManual(code, prefill) { editing = null; openForm('Add by hand', { barcode: code || '', series: prefill || '' }); $('mSeries').focus(); }
function openEdit(r) { editing = r; openForm('Edit comic', r); }
function closeForm() { editing = null; $('manualBox').hidden = true; }
const rowCheck = r => [r.series, r.issue, r.barcode].join('|');
$('manual').onclick = () => openManual($('code').value.replace(/\D/g, ''));
$('mCancel').onclick = closeForm;
$('mSave').onclick = async () => {
  const row = {};
  Object.keys(FIELDS).forEach(k => row[k] = $(FIELDS[k]).value.trim());
  if (!row.series) return say('Add a series or title.', true);
  if (editing) {
    try {
      await api('update', { row: editing._row, check: rowCheck(editing), data: JSON.stringify(row) });
      say('Changes saved.'); closeForm(); loadList();
    } catch (e) { say(e.message, true); }
    return;
  }
  row.source = 'manual';
  save(row).then(() => closeForm());
};
$('mDelete').onclick = async () => {
  if (!editing || !confirm('Delete "' + editing.series + (editing.issue ? ' #' + editing.issue : '') + '" from your collection?')) return;
  try {
    await api('delete', { row: editing._row, check: rowCheck(editing) });
    say('Deleted.'); closeForm(); loadList();
  } catch (e) { say(e.message, true); loadList(); }
};

async function search(q) {
  if (!store.get('url')) { $('settings').open = true; return say('Add your connection first.', true); }
  say('Searching for "' + q + '"...'); $('hits').textContent = ''; $('issueFilterBox').hidden = true;
  try {
    const j = await api('search', { q });
    if (!(j.results || []).length) {
      results = []; owned = [];
      say('No match for "' + q + '". Enter it by hand.' + (pendingCode ? ' The barcode will be saved.' : ''), true);
      openManual(pendingCode, q); return;
    }
    showResults({ results: j.results, owned: [] });
  } catch (e) { say(e.message, true); }
}
$('go').onclick = () => {
  const v = $('code').value.trim(); if (!v) return;
  const digits = v.replace(/[\s-]/g, '');
  /^\d{8,}$/.test(digits) ? lookup(digits) : search(v);
};
$('code').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };

let live = false;
const READERS = ['ean_reader', 'upc_reader', 'ean_8_reader', 'upc_e_reader'];
function stopCam() {
  if (live) { try { Quagga.stop(); } catch (e) {} live = false; }
  $('reader').textContent = ''; $('cam').textContent = 'Scan with camera';
}
function accept(text) { stopCam(); $('code').value = text; lookup(text); }

$('cam').onclick = () => {
  if (live) return stopCam();
  live = true; $('cam').textContent = 'Stop camera';
  const hits = {};
  Quagga.offDetected();
  Quagga.onDetected(r => {
    const c = r.codeResult.code; hits[c] = (hits[c] || 0) + 1;
    if (hits[c] >= 2) accept(c);
  });
  Quagga.init({
    inputStream: { type: 'LiveStream', target: $('reader'),
      constraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      area: { top: '25%', bottom: '25%', left: '5%', right: '5%' } },
    decoder: { readers: READERS }, locate: true, numOfWorkers: 0, frequency: 10
  }, err => {
    if (err) { stopCam(); return say('Camera unavailable: ' + err, true); }
    Quagga.start();
  });
};

$('photoBtn').onclick = () => $('photo').click();
$('photo').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  say('Reading photo...');
  const url = URL.createObjectURL(f);
  let found = null;
  for (const t of [{ s: 1600, p: 'large' }, { s: 2400, p: 'large' }, { s: 1200, p: 'medium' }]) {
    found = await new Promise(res => Quagga.decodeSingle({
      src: url, numOfWorkers: 0, inputStream: { size: t.s },
      locator: { patchSize: t.p, halfSample: false }, decoder: { readers: READERS }, locate: true
    }, r => res(r && r.codeResult ? r.codeResult.code : null)));
    if (found) break;
  }
  URL.revokeObjectURL(url); e.target.value = '';
  if (found) accept(found);
  else say('No barcode found in that photo. Retake it closer, with the barcode flat and well lit.', true);
};

async function loadList() {
  if (!store.get('url')) return;
  try { collection = (await api('list')).rows.reverse(); renderList(); } catch (e) { say(e.message, true); }
}
function renderList() {
  const f = $('filter').value.toLowerCase(), ul = $('list'); ul.textContent = '';
  const rows = collection.filter(r => !f || (r.series + ' ' + r.publisher).toLowerCase().includes(f));
  $('count').textContent = '(' + collection.length + ')';
  rows.slice(0, 200).forEach(r => {
    const li = document.createElement('li'); li.className = 'c';
    let thumb;
    if (r.cover_url) {
      thumb = document.createElement('img'); thumb.className = 'thumb'; thumb.alt = ''; thumb.loading = 'lazy';
      thumb.src = r.cover_url;
      thumb.onerror = () => { const p = document.createElement('div'); p.className = 'thumb'; thumb.replaceWith(p); };
    } else { thumb = document.createElement('div'); thumb.className = 'thumb'; }
    const g = document.createElement('div'); g.className = 'grow';
    const b = document.createElement('b'); b.textContent = r.series + (r.issue ? ' #' + r.issue : '') + (r.variant ? ' (' + r.variant + ')' : '');
    const s = document.createElement('small'); s.style.color = 'var(--mute)'; s.textContent = [r.publisher, r.cover_date].filter(Boolean).join(', ');
    g.append(b, s);
    const edit = document.createElement('button'); edit.className = 'alt'; edit.textContent = 'Edit';
    edit.style.cssText = 'padding:4px 10px;font-size:.85rem;flex:none';
    edit.onclick = () => openEdit(r);
    li.append(thumb, g, edit); ul.append(li);
  });
  if (!rows.length) { const li = document.createElement('li'); li.className = 'c'; li.textContent = 'Nothing here yet. Scan your first comic.'; ul.append(li); }
}
$('filter').oninput = renderList;
loadList();
</script>
</body>
</html>
